<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"
     role="img" aria-label="Belgeden tabloya — poliçe PDF ve ruhsat okuma, Excel çıktısı">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1428"/>
      <stop offset=".55" stop-color="#122544"/>
      <stop offset="1" stop-color="#0b1a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="56%">
      <stop offset="0" stop-color="#2a78d6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#2a78d6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4a843" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d4a843" stop-opacity=".9"/>
      <stop offset="1" stop-color="#d4a843" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanband" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4a843" stop-opacity="0"/>
      <stop offset="1" stop-color="#d4a843" stop-opacity=".22"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <!-- Sahne, guvenli alana (x 300..1170, y 195..700) oturtulur: cover genis
       ekranda ust/alti, sagdaki giris karti da sag kenari kirpiyor. -->
  <g transform="translate(-11.3 72.5) scale(0.9375)">


  <!-- ── kaynak belge (PDF / ruhsat) ── -->
  <g>
    <!-- arkadaki ikinci sayfa -->
    <rect x="356" y="200" width="300" height="404" rx="14"
          fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".08"
          transform="rotate(-4 506 402)"/>
    <!-- ön sayfa -->
    <rect x="332" y="188" width="316" height="424" rx="14"
          fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".16"/>
    <!-- kıvrık köşe -->
    <path d="M600 188 h48 v48 z" fill="#fff" fill-opacity=".10"/>
    <path d="M600 188 v48 h48" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.5"/>

    <!-- belge başlığı -->
    <rect x="364" y="226" width="150" height="14" rx="7" fill="#fff" fill-opacity=".28"/>
    <rect x="364" y="250" width="96" height="9" rx="4" fill="#fff" fill-opacity=".14"/>

    <!-- alan / değer çiftleri -->
    <g>
      <rect x="364" y="288" width="80" height="9" rx="4" fill="#fff" fill-opacity=".12"/>
      <rect x="456" y="288" width="150" height="9" rx="4" fill="#fff" fill-opacity=".22"/>
      <rect x="364" y="316" width="66" height="9" rx="4" fill="#fff" fill-opacity=".12"/>
      <rect x="456" y="316" width="118" height="9" rx="4" fill="#fff" fill-opacity=".22"/>
      <rect x="364" y="344" width="88" height="9" rx="4" fill="#fff" fill-opacity=".12"/>
      <rect x="456" y="344" width="136" height="9" rx="4" fill="#fff" fill-opacity=".22"/>
      <rect x="364" y="372" width="72" height="9" rx="4" fill="#fff" fill-opacity=".12"/>
      <rect x="456" y="372" width="98" height="9" rx="4" fill="#fff" fill-opacity=".22"/>
    </g>

    <!-- tarama bandı + çizgi -->
    <rect x="332" y="330" width="316" height="76" fill="url(#scanband)"/>
    <rect x="332" y="404" width="316" height="3" fill="url(#scan)"/>

    <!-- alt: QR kare -->
    <g>
      <rect x="364" y="440" width="92" height="92" rx="8" fill="none" stroke="#f0ca6e" stroke-opacity=".55" stroke-width="2"/>
      <g fill="#f0ca6e" fill-opacity=".8">
        <rect x="376" y="452" width="22" height="22" rx="3"/>
        <rect x="422" y="452" width="22" height="22" rx="3"/>
        <rect x="376" y="498" width="22" height="22" rx="3"/>
        <rect x="410" y="486" width="10" height="10"/>
        <rect x="428" y="498" width="10" height="10"/>
        <rect x="410" y="510" width="10" height="10"/>
      </g>
      <rect x="474" y="452" width="132" height="9" rx="4" fill="#fff" fill-opacity=".18"/>
      <rect x="474" y="472" width="104" height="9" rx="4" fill="#fff" fill-opacity=".12"/>
      <rect x="474" y="492" width="118" height="9" rx="4" fill="#fff" fill-opacity=".12"/>
      <rect x="474" y="512" width="86" height="9" rx="4" fill="#fff" fill-opacity=".10"/>
    </g>
  </g>

  <!-- ── dönüşüm oku ── -->
  <g transform="translate(688 366)">
    <circle cx="36" cy="36" r="36" fill="#d4a843" fill-opacity=".16" stroke="#d4a843" stroke-opacity=".5"/>
    <path d="M20 36 h30" fill="none" stroke="#f0ca6e" stroke-width="4" stroke-linecap="round"/>
    <path d="M40 26 l12 10 -12 10" fill="none" stroke="#f0ca6e" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#d4a843" fill-opacity=".5">
      <circle cx="-14" cy="36" r="4"/><circle cx="-34" cy="36" r="3"/>
      <circle cx="86" cy="36" r="4"/><circle cx="106" cy="36" r="3"/>
    </g>
  </g>

  <!-- ── hedef tablo (Excel) ── -->
  <g>
    <rect x="808" y="188" width="452" height="424" rx="16"
          fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".14"/>
    <!-- başlık şeridi -->
    <path d="M808 204 a16 16 0 0 1 16 -16 h420 a16 16 0 0 1 16 16 v40 H808 Z"
          fill="#27ae60" fill-opacity=".22"/>
    <g fill="#5fd18f" fill-opacity=".65">
      <rect x="832" y="212" width="52" height="9" rx="4"/>
      <rect x="912" y="212" width="64" height="9" rx="4"/>
      <rect x="1004" y="212" width="56" height="9" rx="4"/>
      <rect x="1088" y="212" width="60" height="9" rx="4"/>
      <rect x="1176" y="212" width="46" height="9" rx="4"/>
    </g>
    <!-- sütun ayırıcılar -->
    <g stroke="#fff" stroke-opacity=".08">
      <line x1="896" y1="244" x2="896" y2="596"/>
      <line x1="988" y1="244" x2="988" y2="596"/>
      <line x1="1072" y1="244" x2="1072" y2="596"/>
      <line x1="1160" y1="244" x2="1160" y2="596"/>
    </g>
    <!-- satırlar -->
    <g>
      <g stroke="#fff" stroke-opacity=".08">
        <line x1="808" y1="288" x2="1260" y2="288"/><line x1="808" y1="332" x2="1260" y2="332"/>
        <line x1="808" y1="376" x2="1260" y2="376"/><line x1="808" y1="420" x2="1260" y2="420"/>
        <line x1="808" y1="464" x2="1260" y2="464"/><line x1="808" y1="508" x2="1260" y2="508"/>
        <line x1="808" y1="552" x2="1260" y2="552"/>
      </g>
      <g fill="#fff" fill-opacity=".2">
        <rect x="832" y="261" width="46" height="9" rx="4"/><rect x="912" y="261" width="58" height="9" rx="4"/>
        <rect x="1004" y="261" width="50" height="9" rx="4"/><rect x="1088" y="261" width="54" height="9" rx="4"/>
        <rect x="1176" y="261" width="40" height="9" rx="4"/>

        <rect x="832" y="305" width="46" height="9" rx="4"/><rect x="912" y="305" width="52" height="9" rx="4"/>
        <rect x="1004" y="305" width="56" height="9" rx="4"/><rect x="1088" y="305" width="48" height="9" rx="4"/>
        <rect x="1176" y="305" width="40" height="9" rx="4"/>

        <rect x="832" y="349" width="46" height="9" rx="4"/><rect x="912" y="349" width="60" height="9" rx="4"/>
        <rect x="1004" y="349" width="44" height="9" rx="4"/><rect x="1088" y="349" width="56" height="9" rx="4"/>
        <rect x="1176" y="349" width="40" height="9" rx="4"/>
      </g>
      <!-- yeni gelen satır (altın vurgu) -->
      <rect x="808" y="376" width="452" height="44" fill="#d4a843" fill-opacity=".14"/>
      <g fill="#f0ca6e" fill-opacity=".75">
        <rect x="832" y="393" width="46" height="9" rx="4"/><rect x="912" y="393" width="58" height="9" rx="4"/>
        <rect x="1004" y="393" width="50" height="9" rx="4"/><rect x="1088" y="393" width="52" height="9" rx="4"/>
        <rect x="1176" y="393" width="40" height="9" rx="4"/>
      </g>
      <g fill="#fff" fill-opacity=".16">
        <rect x="832" y="437" width="46" height="9" rx="4"/><rect x="912" y="437" width="54" height="9" rx="4"/>
        <rect x="1004" y="437" width="52" height="9" rx="4"/><rect x="1088" y="437" width="46" height="9" rx="4"/>
        <rect x="1176" y="437" width="40" height="9" rx="4"/>

        <rect x="832" y="481" width="46" height="9" rx="4"/><rect x="912" y="481" width="62" height="9" rx="4"/>
        <rect x="1004" y="481" width="46" height="9" rx="4"/><rect x="1088" y="481" width="54" height="9" rx="4"/>
        <rect x="1176" y="481" width="40" height="9" rx="4"/>
      </g>
      <g fill="#fff" fill-opacity=".1">
        <rect x="832" y="525" width="46" height="9" rx="4"/><rect x="912" y="525" width="50" height="9" rx="4"/>
        <rect x="1004" y="525" width="54" height="9" rx="4"/><rect x="1088" y="525" width="44" height="9" rx="4"/>
        <rect x="1176" y="525" width="40" height="9" rx="4"/>

        <rect x="832" y="569" width="46" height="9" rx="4"/><rect x="912" y="569" width="56" height="9" rx="4"/>
        <rect x="1004" y="569" width="48" height="9" rx="4"/><rect x="1088" y="569" width="50" height="9" rx="4"/>
      </g>
    </g>
  </g>

  <!-- gizlilik rozeti: tarayıcıda işlenir -->
  <g transform="translate(700 490)">
    <rect x="-46" y="0" width="164" height="44" rx="22" fill="#fff" fill-opacity=".07"
          stroke="#fff" stroke-opacity=".16"/>
    <path d="M-16 22 v-8 a10 10 0 0 1 20 0 v8" fill="none" stroke="#7fb2f0" stroke-width="2.6"
          stroke-linecap="round"/>
    <rect x="-22" y="21" width="32" height="14" rx="4" fill="#7fb2f0" fill-opacity=".8"/>
    <rect x="24" y="18" width="76" height="8" rx="4" fill="#fff" fill-opacity=".22"/>
  </g>

  </g>
</svg>
