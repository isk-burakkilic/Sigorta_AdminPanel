            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- çan / hatırlatma rozeti -->
  <g transform="translate(1176 130)">
    <circle cx="24" cy="24" r="24" fill="#d4a843" fill-opacity=".2" stroke="#d4a843" stroke-opacity=".55"/>
    <path d="M24 12 c-5 0 -8 4 -8 9 v6 l-3 4 h22 l-3 -4 v-6 c0 -5 -3 -9 -8 -9 z"
          fill="none" stroke="#f0ca6e" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M20 33 a4 4 0 0 0 8 0" fill="none" stroke="#f0ca6e" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="38" cy="12" r="6" fill="#e74c3c"/>
  </g>

  </g>
</svg>
