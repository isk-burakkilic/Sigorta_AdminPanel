<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"
     role="img" aria-label="Yenileme takibi — takvim ve bitiş tarihi yaklaşan poliçe listesi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1428"/>
      <stop offset=".55" stop-color="#122544"/>
      <stop offset="1" stop-color="#0b1a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="46%" cy="32%" r="56%">
      <stop offset="0" stop-color="#d4a843" stop-opacity=".2"/>
      <stop offset="1" stop-color="#d4a843" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <!-- Sahne, guvenli alana (x 300..1170, y 195..700) oturtulur: cover genis
       ekranda ust/alti, sagdaki giris karti da sag kenari kirpiyor. -->
  <g transform="translate(-8.7 78) scale(0.9355)">


  <!-- ── takvim kartı ── -->
  <g>
    <rect x="330" y="190" width="420" height="470" rx="18"
          fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".13"/>
    <!-- başlık -->
    <rect x="366" y="224" width="150" height="13" rx="6" fill="#fff" fill-opacity=".22"/>
    <g fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2.5" stroke-linecap="round">
      <path d="M684 224 l-12 12 12 12"/>
      <path d="M714 224 l12 12 -12 12"/>
    </g>
    <!-- gün başlıkları -->
    <g fill="#98a3b8" font-family="system-ui,'Segoe UI',Roboto,sans-serif" font-size="14"
       text-anchor="middle" letter-spacing="1">
      <text x="392" y="278">P</text><text x="446" y="278">S</text><text x="500" y="278">Ç</text>
      <text x="554" y="278">P</text><text x="608" y="278">C</text><text x="662" y="278">C</text>
      <text x="716" y="278">P</text>
    </g>
    <!-- gün hücreleri: 5 satır x 7 -->
    <g>
      <g fill="#fff" fill-opacity=".07">
        <rect x="372" y="296" width="40" height="40" rx="9"/><rect x="426" y="296" width="40" height="40" rx="9"/>
        <rect x="480" y="296" width="40" height="40" rx="9"/><rect x="534" y="296" width="40" height="40" rx="9"/>
        <rect x="588" y="296" width="40" height="40" rx="9"/><rect x="642" y="296" width="40" height="40" rx="9"/>
        <rect x="696" y="296" width="40" height="40" rx="9"/>

        <rect x="372" y="348" width="40" height="40" rx="9"/><rect x="426" y="348" width="40" height="40" rx="9"/>
        <rect x="534" y="348" width="40" height="40" rx="9"/>
        <rect x="588" y="348" width="40" height="40" rx="9"/><rect x="642" y="348" width="40" height="40" rx="9"/>
        <rect x="696" y="348" width="40" height="40" rx="9"/>

        <rect x="372" y="400" width="40" height="40" rx="9"/>
        <rect x="480" y="400" width="40" height="40" rx="9"/><rect x="534" y="400" width="40" height="40" rx="9"/>
        <rect x="642" y="400" width="40" height="40" rx="9"/>
        <rect x="696" y="400" width="40" height="40" rx="9"/>

        <rect x="372" y="452" width="40" height="40" rx="9"/><rect x="426" y="452" width="40" height="40" rx="9"/>
        <rect x="480" y="452" width="40" height="40" rx="9"/>
        <rect x="588" y="452" width="40" height="40" rx="9"/><rect x="642" y="452" width="40" height="40" rx="9"/>

        <rect x="372" y="504" width="40" height="40" rx="9"/><rect x="480" y="504" width="40" height="40" rx="9"/>
        <rect x="534" y="504" width="40" height="40" rx="9"/><rect x="588" y="504" width="40" height="40" rx="9"/>
        <rect x="696" y="504" width="40" height="40" rx="9"/>
