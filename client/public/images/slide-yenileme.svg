      <circle cx="844" cy="326" r="8" fill="#d4a843"/>
      <rect x="868" y="308" width="176" height="12" rx="6" fill="#fff" fill-opacity=".30"/>
      <rect x="868" y="330" width="112" height="10" rx="5" fill="#fff" fill-opacity=".16"/>
      <rect x="1132" y="312" width="86" height="28" rx="14" fill="#d4a843" fill-opacity=".32"/>
      <rect x="1146" y="322" width="58" height="8" rx="4" fill="#f0ca6e" fill-opacity=".85"/>
    </g>
    <!-- satır 2..4 -->
    <g>
      <rect x="812" y="378" width="426" height="76" rx="13" fill="#fff" fill-opacity=".045"/>
      <circle cx="844" cy="416" r="8" fill="#f39c12" fill-opacity=".8"/>
      <rect x="868" y="398" width="150" height="12" rx="6" fill="#fff" fill-opacity=".22"/>
      <rect x="868" y="420" width="96" height="10" rx="5" fill="#fff" fill-opacity=".12"/>
      <rect x="1132" y="402" width="86" height="28" rx="14" fill="#fff" fill-opacity=".10"/>
      <rect x="1146" y="412" width="58" height="8" rx="4" fill="#fff" fill-opacity=".22"/>
    </g>
    <g>
      <rect x="812" y="468" width="426" height="76" rx="13" fill="#fff" fill-opacity=".045"/>
      <circle cx="844" cy="506" r="8" fill="#2a78d6" fill-opacity=".8"/>
      <rect x="868" y="488" width="190" height="12" rx="6" fill="#fff" fill-opacity=".22"/>
      <rect x="868" y="510" width="80" height="10" rx="5" fill="#fff" fill-opacity=".12"/>
      <rect x="1132" y="492" width="86" height="28" rx="14" fill="#fff" fill-opacity=".10"/>
      <rect x="1146" y="502" width="58" height="8" rx="4" fill="#fff" fill-opacity=".22"/>
    </g>
    <g>
      <rect x="812" y="558" width="426" height="76" rx="13" fill="#fff" fill-opacity=".045"/>
      <circle cx="844" cy="596" r="8" fill="#27ae60" fill-opacity=".8"/>
      <rect x="868" y="578" width="162" height="12" rx="6" fill="#fff" fill-opacity=".22"/>
      <rect x="868" y="600" width="104" height="10" rx="5" fill="#fff" fill-opacity=".12"/>
      <rect x="1132" y="582" width="86" height="28" rx="14" fill="#27ae60" fill-opacity=".22"/>
