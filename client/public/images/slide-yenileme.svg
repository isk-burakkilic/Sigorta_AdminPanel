      <!-- yenileme günleri -->
      <rect x="480" y="348" width="40" height="40" rx="9" fill="#2a78d6" fill-opacity=".38"/>
      <rect x="426" y="400" width="40" height="40" rx="9" fill="#2a78d6" fill-opacity=".38"/>
      <rect x="588" y="400" width="40" height="40" rx="9" fill="#f39c12" fill-opacity=".42"/>
      <rect x="534" y="452" width="40" height="40" rx="9" fill="#2a78d6" fill-opacity=".38"/>
      <rect x="696" y="452" width="40" height="40" rx="9" fill="#f39c12" fill-opacity=".42"/>
      <rect x="426" y="504" width="40" height="40" rx="9" fill="#2a78d6" fill-opacity=".38"/>
      <rect x="642" y="504" width="40" height="40" rx="9" fill="#2a78d6" fill-opacity=".38"/>
      <!-- bugün: altın halka -->
      <rect x="640" y="398" width="44" height="44" rx="11" fill="none" stroke="#d4a843" stroke-width="3"/>
      <circle cx="662" cy="452" r="3.5" fill="#d4a843"/>
    </g>
    <!-- açıklama -->
    <g>
      <circle cx="384" cy="596" r="6" fill="#2a78d6" fill-opacity=".7"/>
      <rect x="398" y="590" width="86" height="10" rx="5" fill="#fff" fill-opacity=".14"/>
      <circle cx="512" cy="596" r="6" fill="#f39c12" fill-opacity=".8"/>
      <rect x="526" y="590" width="98" height="10" rx="5" fill="#fff" fill-opacity=".14"/>
    </g>
  </g>

  <!-- ── bitişi yaklaşan poliçeler ── -->
  <g>
    <rect x="790" y="190" width="470" height="470" rx="18"
          fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".13"/>
    <rect x="826" y="224" width="188" height="13" rx="6" fill="#fff" fill-opacity=".22"/>
    <rect x="1160" y="218" width="64" height="24" rx="12" fill="#f39c12" fill-opacity=".3"
          stroke="#f39c12" stroke-opacity=".55"/>
    <line x1="790" y1="266" x2="1260" y2="266" stroke="#fff" stroke-opacity=".10"/>

    <!-- satır 1 — kritik (altın vurgu) -->
    <g>
      <rect x="812" y="288" width="426" height="76" rx="13" fill="#d4a843" fill-opacity=".13"
