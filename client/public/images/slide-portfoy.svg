<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"
     role="img" aria-label="Portföy analizi — branş ve şirket dağılımı, prim toplamları">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1428"/>
      <stop offset=".55" stop-color="#122544"/>
      <stop offset="1" stop-color="#0b1a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="48%" cy="34%" r="54%">
      <stop offset="0" stop-color="#4a3aa7" stop-opacity=".24"/>
      <stop offset="1" stop-color="#4a3aa7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <!-- Sahne, guvenli alana (x 300..1170, y 195..700) oturtulur: cover genis
       ekranda ust/alti, sagdaki giris karti da sag kenari kirpiyor. -->
  <g transform="translate(-7.1 91.1) scale(0.9139)">


  <!-- ── halka grafik: branş dağılımı ── -->
  <g>
    <rect x="336" y="186" width="404" height="472" rx="18"
          fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".13"/>
    <rect x="372" y="220" width="142" height="13" rx="6" fill="#fff" fill-opacity=".22"/>

    <!-- donut: r=104, çevre = 653.5 -->
    <g transform="translate(538 392)">
      <circle r="104" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="46"/>
      <!-- Trafik %34 -> 222.2 -->
      <circle r="104" fill="none" stroke="#2a78d6" stroke-width="46"
              stroke-dasharray="222.2 653.5" transform="rotate(-90)"/>
      <!-- Kasko %27 -> 176.4, offset 222.2 -->
      <circle r="104" fill="none" stroke="#008300" stroke-width="46"
              stroke-dasharray="176.4 653.5" stroke-dashoffset="-222.2" transform="rotate(-90)"/>
      <!-- Konut %16 -> 104.6, offset 398.6 -->
      <circle r="104" fill="none" stroke="#e87ba4" stroke-width="46"
              stroke-dasharray="104.6 653.5" stroke-dashoffset="-398.6" transform="rotate(-90)"/>
      <!-- DASK %13 -> 85, offset 503.2 -->
      <circle r="104" fill="none" stroke="#eda100" stroke-width="46"
              stroke-dasharray="85 653.5" stroke-dashoffset="-503.2" transform="rotate(-90)"/>
      <!-- Diğer %10 -> 65.3, offset 588.2 -->
      <circle r="104" fill="none" stroke="#1baf7a" stroke-width="46"
              stroke-dasharray="65.3 653.5" stroke-dashoffset="-588.2" transform="rotate(-90)"/>
      <!-- merkez -->
      <circle r="72" fill="#0e1a30"/>
      <text y="-4" fill="#e6eaf2" font-size="30" font-weight="700" text-anchor="middle"
            font-family="system-ui,'Segoe UI',Roboto,sans-serif">1.284</text>
      <rect x="-34" y="14" width="68" height="8" rx="4" fill="#fff" fill-opacity="0.18"/>
    </g>

    <!-- gösterge -->
    <g>
      <g><circle cx="382" cy="552" r="6" fill="#2a78d6"/>
         <rect x="396" y="546" width="96" height="10" rx="5" fill="#fff" fill-opacity=".18"/></g>
      <g><circle cx="382" cy="580" r="6" fill="#008300"/>
         <rect x="396" y="574" width="78" height="10" rx="5" fill="#fff" fill-opacity=".16"/></g>
      <g><circle cx="382" cy="608" r="6" fill="#e87ba4"/>
         <rect x="396" y="602" width="86" height="10" rx="5" fill="#fff" fill-opacity=".14"/></g>
      <g><circle cx="566" cy="552" r="6" fill="#eda100"/>
         <rect x="580" y="546" width="72" height="10" rx="5" fill="#fff" fill-opacity=".18"/></g>
      <g><circle cx="566" cy="580" r="6" fill="#1baf7a"/>
         <rect x="580" y="574" width="90" height="10" rx="5" fill="#fff" fill-opacity=".16"/></g>
      <g><circle cx="566" cy="608" r="6" fill="#fff" fill-opacity=".3"/>
         <rect x="580" y="602" width="64" height="10" rx="5" fill="#fff" fill-opacity=".12"/></g>
    </g>
  </g>

  <!-- ── şirket bazında prim: yatay çubuklar ── -->
  <g>
    <rect x="772" y="186" width="488" height="472" rx="18"
          fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".13"/>
    <rect x="808" y="220" width="168" height="13" rx="6" fill="#fff" fill-opacity=".22"/>
    <rect x="1160" y="214" width="64" height="24" rx="12" fill="#4a3aa7" fill-opacity=".38"/>

    <g>
      <!-- 1 -->
      <rect x="808" y="268" width="96" height="10" rx="5" fill="#fff" fill-opacity=".2"/>
      <rect x="808" y="288" width="404" height="22" rx="11" fill="#fff" fill-opacity=".06"/>
      <rect x="808" y="288" width="368" height="22" rx="11" fill="#2a78d6" fill-opacity=".75"/>
      <!-- 2 -->
      <rect x="808" y="336" width="82" height="10" rx="5" fill="#fff" fill-opacity=".2"/>
      <rect x="808" y="356" width="404" height="22" rx="11" fill="#fff" fill-opacity=".06"/>
      <rect x="808" y="356" width="292" height="22" rx="11" fill="#008300" fill-opacity=".7"/>
      <!-- 3 -->
      <rect x="808" y="404" width="104" height="10" rx="5" fill="#fff" fill-opacity=".2"/>
      <rect x="808" y="424" width="404" height="22" rx="11" fill="#fff" fill-opacity=".06"/>
      <rect x="808" y="424" width="236" height="22" rx="11" fill="#e87ba4" fill-opacity=".7"/>
      <!-- 4 -->
      <rect x="808" y="472" width="76" height="10" rx="5" fill="#fff" fill-opacity=".2"/>
      <rect x="808" y="492" width="404" height="22" rx="11" fill="#fff" fill-opacity=".06"/>
      <rect x="808" y="492" width="168" height="22" rx="11" fill="#eda100" fill-opacity=".72"/>
      <!-- 5 -->
      <rect x="808" y="540" width="92" height="10" rx="5" fill="#fff" fill-opacity=".2"/>
      <rect x="808" y="560" width="404" height="22" rx="11" fill="#fff" fill-opacity=".06"/>
      <rect x="808" y="560" width="112" height="22" rx="11" fill="#1baf7a" fill-opacity=".7"/>
      <!-- 6 -->
      <rect x="808" y="608" width="68" height="10" rx="5" fill="#fff" fill-opacity=".16"/>
      <rect x="808" y="628" width="404" height="14" rx="7" fill="#fff" fill-opacity=".06"/>
      <rect x="808" y="628" width="64" height="14" rx="7" fill="#fff" fill-opacity=".22"/>
    </g>
  </g>

  <!-- toplam prim rozeti -->
  <g transform="translate(1128 122)">
    <rect x="0" y="0" width="160" height="48" rx="24" fill="#d4a843" fill-opacity=".16"
          stroke="#d4a843" stroke-opacity=".5"/>
    <path d="M24 32 L38 18 L50 25 L68 12" fill="none" stroke="#f0ca6e" stroke-width="3.2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M59 12 h10 v10" fill="none" stroke="#f0ca6e" stroke-width="3.2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="86" y="20" width="54" height="9" rx="4" fill="#f0ca6e" fill-opacity=".6"/>
  </g>

  </g>
</svg>
